name: Snowfall verification
on:
  pull_request:
  push:
    branches: [v10-dev, main, 'release/**', 'validation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '26.5.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run preview:snowfall
      - name: Native PTY lifecycle (POSIX)
        if: runner.os != 'Windows'
        run: python3 scripts/smoke-snowfall-pty.py node dist/index.js
      - name: Guided onboarding lifecycle (POSIX)
        if: runner.os != 'Windows'
        run: python3 scripts/smoke-onboard-pty.py node dist/index.js
      - name: Interrupt stalled provider streams (POSIX)
        if: runner.os != 'Windows'
        run: python3 scripts/smoke-interrupt-pty.py node dist/index.js
