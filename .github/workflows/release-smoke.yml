name: Signed release smoke
on:
  push:
    branches: [release/blackfrost-8.7.1]
  workflow_dispatch:
    inputs:
      legacy_bridge:
        description: Verify the old-host transition after both origins are promoted
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x64
          - runner: ubuntu-24.04-arm
            label: Linux ARM64
          - runner: macos-15-intel
            label: macOS Intel
          - runner: macos-15
            label: macOS ARM64
          - runner: windows-2022
            label: Windows PowerShell 5.1
            shell: powershell.exe
            command_shell: powershell
          - runner: windows-2022
            label: Windows PowerShell 7
            shell: pwsh.exe
            command_shell: pwsh
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SMOKE_POWERSHELL: ${{ matrix.shell }}
      SHADOW_LEGACY_SMOKE: ${{ inputs.legacy_bridge || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify signed binaries and installer safety
        shell: ${{ matrix.command_shell || 'bash' }}
        run: node scripts/smoke-release.mjs
